<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Little Rescue Squad</title>
<style>
  :root{
    --sky-top:#8ED6FF;
    --sky-bottom:#E8F7FF;
    --sun:#FFD54F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
    font-family:system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  #world{position:fixed;inset:0;overflow:hidden;cursor:pointer;}

  .sun{position:absolute;top:24px;right:28px;width:110px;height:110px;pointer-events:none;}
  .sun .core{
    position:absolute;inset:20px;border-radius:50%;
    background:var(--sun);
    box-shadow:0 0 40px 12px rgba(255,213,79,.55);
  }
  .sun .rays{position:absolute;inset:0;animation:spinSlow 40s linear infinite;}
  .sun .rays span{
    position:absolute;left:50%;top:50%;
    width:8px;height:54px;margin-left:-4px;margin-top:-27px;
    background:var(--sun);border-radius:4px;opacity:.75;
  }
  @keyframes spinSlow{to{transform:rotate(360deg);}}

  .cloud{
    position:absolute;pointer-events:none;opacity:.92;
    filter:drop-shadow(0 6px 8px rgba(120,170,210,.25));
  }

  /* ---------- ocean ---------- */
  #ocean{
    position:absolute;left:0;right:0;pointer-events:none;
    background:linear-gradient(180deg,#4FC3F7 0%,#0288D1 100%);
  }
  .waveStrip{
    position:absolute;left:0;height:26px;pointer-events:none;
    animation:waveMove linear infinite;will-change:transform;
  }
  @keyframes waveMove{to{transform:translateX(var(--shift));}}

  /* ---------- rescue dock ---------- */
  #dockTop{
    position:absolute;height:16px;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(90deg,#A1887F 0 34px,#8D6E63 34px 38px);
    border-radius:8px 0 0 8px;
    box-shadow:0 3px 5px rgba(2,80,130,.3);
  }
  #dockLegs{
    position:absolute;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(90deg,#8D6E63 0 12px,transparent 12px 96px);
  }
  #padmark{position:absolute;pointer-events:none;z-index:1;}
  #station{position:absolute;width:150px;height:118px;pointer-events:none;z-index:1;}
  #station svg{width:100%;height:100%;display:block;}
  #station .beaconDot{opacity:.2;}
  #station.alert .beaconDot{animation:blink .7s steps(2) infinite;}
  @keyframes blink{50%{opacity:1;}}

  #lighthouse{position:absolute;width:100px;height:170px;pointer-events:none;z-index:1;}
  #lighthouse svg{width:100%;height:100%;display:block;}
  .lampGlow{animation:lampPulse 2.4s ease-in-out infinite;}
  @keyframes lampPulse{50%{opacity:.05;}}

  #boat{position:absolute;width:130px;height:80px;pointer-events:none;z-index:1;will-change:transform;}
  #boat svg{width:100%;height:100%;display:block;}

  .raincloud{position:absolute;width:150px;height:150px;pointer-events:none;z-index:2;will-change:transform;}
  .raincloud .rain{
    position:absolute;top:52px;left:16px;width:112px;height:80px;
    background:repeating-linear-gradient(100deg,rgba(100,181,246,0) 0 7px,rgba(100,181,246,.75) 7px 9px);
    animation:rainFall .45s linear infinite;
    -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);
    mask-image:linear-gradient(180deg,#000 60%,transparent);
  }
  @keyframes rainFall{to{background-position:16px 46px;}}

  /* ---------- animals ---------- */
  .animal{
    position:absolute;font-size:38px;line-height:1;
    pointer-events:none;will-change:transform;z-index:2;
    filter:drop-shadow(0 3px 3px rgba(20,90,140,.3));
  }
  .animal.hopIn{animation:hopIn .6s ease-out;}
  @keyframes hopIn{
    0%{transform:scale(0) translateY(20px);}
    60%{transform:scale(1.25) translateY(-10px);}
    100%{transform:scale(1) translateY(0);}
  }
  .animal.float{width:52px;height:56px;font-size:0;z-index:1;}
  .animal.float .fella{position:absolute;left:9px;top:-2px;font-size:34px;line-height:1;}
  .animal.float .ring{position:absolute;left:0;bottom:0;}

  .rope{
    position:absolute;width:3px;border-radius:2px;
    background:#78909C;transform-origin:top center;
    pointer-events:none;z-index:3;will-change:transform,height;
  }
  .basket{
    position:absolute;font-size:34px;line-height:1;
    pointer-events:none;z-index:3;will-change:transform;
    filter:drop-shadow(0 4px 4px rgba(20,90,140,.3));
  }
  .basket .rider{position:absolute;font-size:22px;line-height:1;}

  .heli{
    position:absolute;width:190px;height:130px;
    margin-left:-95px;margin-top:-65px;
    pointer-events:none;will-change:transform;z-index:4;
    filter:drop-shadow(0 10px 10px rgba(20,90,140,.28));
  }
  .rotor-main{transform-origin:95px 14px;animation:rotorSpin .18s linear infinite;}
  .rotor-tail{transform-origin:16px 52px;animation:rotorSpin .12s linear infinite;}
  .heli.landed .rotor-main{animation-duration:1.2s;}
  .heli.landed .rotor-tail{animation-duration:.9s;}
  @keyframes rotorSpin{
    0%{transform:scaleX(1);}
    25%{transform:scaleX(.25);}
    50%{transform:scaleX(1);}
    75%{transform:scaleX(.25);}
    100%{transform:scaleX(1);}
  }
  .heli .beaconDot{animation:blink 1.1s steps(2) infinite;}

  .balloon{position:absolute;width:74px;height:120px;pointer-events:none;will-change:transform;z-index:2;}
  .balloon svg{width:100%;height:100%;display:block;}

  .heart{
    position:absolute;pointer-events:none;font-size:30px;z-index:5;
    animation:heartFloat 1.4s ease-out forwards;
  }
  .bubble{
    position:absolute;pointer-events:none;font-size:24px;z-index:5;
    animation:heartFloat 1.2s ease-out forwards;
  }
  @keyframes heartFloat{
    0%{transform:translateY(0) scale(.4);opacity:0;}
    20%{opacity:1;transform:translateY(-14px) scale(1.15);}
    100%{transform:translateY(-95px) scale(1);opacity:0;}
  }

  .bird{position:absolute;font-size:26px;pointer-events:none;will-change:transform;z-index:2;}

  .rewardStar{
    position:absolute;pointer-events:none;font-size:44px;z-index:5;
    animation:starPop 1s ease-out forwards;
  }
  @keyframes starPop{
    0%{transform:scale(.2) rotate(-20deg);opacity:0;}
    30%{transform:scale(1.4) rotate(8deg);opacity:1;}
    100%{transform:scale(1) rotate(0) translateY(-46px);opacity:0;}
  }

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:6;}

  #p2btn{
    position:absolute;top:18px;left:18px;z-index:10;
    min-height:48px;padding:10px 20px;
    border:none;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.92);
    color:#2B3A4A;font-size:17px;font-weight:700;
    box-shadow:0 4px 12px rgba(20,90,140,.25);
    touch-action:manipulation;
  }
  #p2btn:focus-visible{outline:3px solid #2B6FD8;outline-offset:2px;}
  #p2btn:active{transform:scale(.96);}
  #keyHint{
    position:absolute;top:76px;left:18px;z-index:10;
    padding:8px 14px;border-radius:12px;
    background:rgba(255,255,255,.85);
    color:#2B3A4A;font-size:14px;font-weight:600;
    opacity:0;transition:opacity .5s;pointer-events:none;
  }
  #keyHint .red{color:#E64A19;}
  #keyHint .blue{color:#1E88E5;}

  @media (prefers-reduced-motion:reduce){
    .sun .rays{animation-duration:120s;}
  }
</style>
</head>
<body>
<div id="world">
  <div class="sun">
    <div class="rays" id="rays"></div>
    <div class="core"></div>
  </div>

  <div id="ocean"></div>
  <div id="dockLegs"></div>
  <div id="dockTop"></div>
  <div id="padmark">
    <svg width="110" height="20" viewBox="0 0 110 20">
      <ellipse cx="55" cy="10" rx="50" ry="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <text x="55" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="system-ui,sans-serif">H</text>
    </svg>
  </div>

  <div id="station">
    <svg viewBox="0 0 150 118">
      <line x1="128" y1="34" x2="128" y2="10" stroke="#78909C" stroke-width="3"/>
      <circle class="beaconDot" cx="128" cy="8" r="5" fill="#FF1744"/>
      <line x1="18" y1="44" x2="18" y2="12" stroke="#78909C" stroke-width="3"/>
      <polygon points="20,12 44,17 20,23" fill="#FF7043"/>
      <rect x="4" y="32" width="142" height="14" rx="6" fill="#E15B4E"/>
      <rect x="10" y="44" width="130" height="72" fill="#FFF8F0"/>
      <text x="75" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#E15B4E" letter-spacing="2" font-family="system-ui,sans-serif">RESCUE</text>
      <rect x="16" y="50" width="14" height="14" rx="2" fill="#E15B4E"/>
      <rect x="21" y="52" width="4" height="10" fill="#FFF8F0"/>
      <rect x="18" y="55" width="10" height="4" fill="#FFF8F0"/>
      <rect x="62" y="76" width="26" height="40" rx="3" fill="#90A4AE"/>
      <circle cx="34" cy="90" r="10" fill="#B3E5FC" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="116" cy="90" r="10" fill="#B3E5FC" stroke="#FFFFFF" stroke-width="3"/>
    </svg>
  </div>

  <div id="lighthouse">
    <svg viewBox="0 0 100 170">
      <path d="M6,150 Q20,126 50,134 Q80,124 94,150 L94,170 L6,170 Z" fill="#90A4AE"/>
      <polygon points="34,140 66,140 58,58 42,58" fill="#FDFDFD"/>
      <rect x="36" y="102" width="28" height="14" fill="#E53935"/>
      <rect x="39" y="74" width="22" height="12" fill="#E53935"/>
      <rect x="36" y="50" width="28" height="8" rx="3" fill="#37474F"/>
      <circle class="lampGlow" cx="50" cy="40" r="16" fill="#FFF176" opacity=".4"/>
      <rect x="42" y="32" width="16" height="18" rx="3" fill="#FFF59D"/>
      <polygon points="38,32 62,32 50,18" fill="#E53935"/>
    </svg>
  </div>

  <div id="boat">
    <svg viewBox="0 0 130 80">
      <line x1="92" y1="26" x2="92" y2="6" stroke="#78909C" stroke-width="3"/>
      <polygon points="92,6 114,11 92,17" fill="#FF7043"/>
      <rect x="44" y="24" width="42" height="24" rx="5" fill="#FFF8F0"/>
      <circle cx="58" cy="36" r="6" fill="#B3E5FC" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M8,48 L122,48 L104,74 L26,74 Z" fill="#E64A19"/>
      <circle cx="36" cy="36" r="8" fill="none" stroke="#FF7043" stroke-width="4"/>
      <text x="66" y="67" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFF8F0" font-family="system-ui,sans-serif">9</text>
    </svg>
  </div>

  <button id="p2btn" type="button">Add player 2</button>
  <div id="keyHint"><span class="red">Red: WASD</span> &nbsp;·&nbsp; <span class="blue">Blue: Arrow keys</span></div>

  <canvas id="confetti"></canvas>
</div>

<script>
(function(){
  const world = document.getElementById('world');
  const rays  = document.getElementById('rays');
  const p2btn = document.getElementById('p2btn');
  const keyHint = document.getElementById('keyHint');
  const oceanEl = document.getElementById('ocean');
  const dockTopEl = document.getElementById('dockTop');
  const dockLegsEl = document.getElementById('dockLegs');
  const padmarkEl = document.getElementById('padmark');
  const stationEl = document.getElementById('station');
  const lighthouseEl = document.getElementById('lighthouse');
  const boatEl = document.getElementById('boat');

  for(let i=0;i<8;i++){
    const s=document.createElement('span');
    s.style.transform='rotate('+(i*45)+'deg) translateY(-42px)';
    rays.appendChild(s);
  }

  let W=innerWidth, H=innerHeight;

  // ---------- coastal scene geometry ----------
  let waterY=0, dockLeft=0, dockY=0, padX=0, stationX=0;
  function placeScene(){
    const oceanH=Math.max(H*0.16,110);
    waterY=H-oceanH;
    dockLeft=W*0.60;
    dockY=waterY-38;
    padX=dockLeft+(W-dockLeft)*0.30;
    stationX=dockLeft+(W-dockLeft)*0.78;

    oceanEl.style.top=waterY+'px';
    oceanEl.style.height=oceanH+'px';
    dockTopEl.style.left=(dockLeft-14)+'px';
    dockTopEl.style.width=(W-dockLeft+14)+'px';
    dockTopEl.style.top=dockY+'px';
    dockLegsEl.style.left=dockLeft+'px';
    dockLegsEl.style.width=(W-dockLeft)+'px';
    dockLegsEl.style.top=(dockY+14)+'px';
    dockLegsEl.style.height=(H-dockY-14)+'px';
    padmarkEl.style.left=(padX-55)+'px';
    padmarkEl.style.top=(dockY-10)+'px';
    stationEl.style.left=(stationX-75)+'px';
    stationEl.style.top=(dockY-116)+'px';
    lighthouseEl.style.left='12px';
    lighthouseEl.style.top=(waterY-150)+'px';
  }
  placeScene();
  const REST_OFFSET=56;
  function padRestY(){ return dockY-REST_OFFSET; }

  // ---------- animated waves ----------
  let waveEls=[];
  function buildWaves(){
    waveEls.forEach(e=>e.remove()); waveEls=[];
    const period=140;
    const w=Math.ceil((W+period)/period)*period*2;
    function strip(color,dur,top,amp,phasePx,z,op){
      const d=document.createElement('div');
      d.className='waveStrip';
      d.style.top=top+'px';
      d.style.width=w+'px';
      d.style.zIndex=z;
      d.style.opacity=op;
      d.style.marginLeft=(-phasePx)+'px';
      d.style.setProperty('--shift',(-w/2)+'px');
      d.style.animationDuration=dur+'s';
      let path='M0,'+amp+' ';
      for(let x=0;x<w;x+=period){
        path+='Q'+(x+period/4)+',0 '+(x+period/2)+','+amp+' T'+(x+period)+','+amp+' ';
      }
      path+='L'+w+',60 L0,60 Z';
      d.innerHTML='<svg width="'+w+'" height="26" viewBox="0 0 '+w+' 60" preserveAspectRatio="none"><path d="'+path+'" fill="'+color+'"/></svg>';
      world.appendChild(d);
      waveEls.push(d);
    }
    strip('#81D4FA',14,waterY-16,16,70,0,.95);
    strip('#29B6F6',9,waterY-8,16,0,2,1);
  }
  buildWaves();

  // ---------- audio ----------
  let actx=null;
  function unlockAudio(){
    if(!actx){
      try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    if(actx && actx.state==='suspended') actx.resume();
  }
  function tone(freq,delay,dur,type,vol,glideTo){
    if(!actx) return;
    const t=actx.currentTime+delay;
    const o=actx.createOscillator();
    const g=actx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur*.8);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||.3,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t+dur+.05);
  }
  const notes=[523.25,587.33,659.25,783.99,880.00,1046.5];
  function popSound(){
    const f=notes[Math.floor(Math.random()*notes.length)];
    tone(f,0,.35,'sine',.35,f*1.6);
  }
  function arpeggio(){
    tone(523.25,0,.25,'sine',.3);
    tone(659.25,.1,.25,'sine',.3);
    tone(783.99,.2,.3,'sine',.3);
    tone(1046.5,.32,.45,'sine',.32);
  }
  function boopSound(){ tone(660,0,.14,'square',.12); tone(880,.12,.18,'square',.12); }
  function whooshSound(){ tone(180,0,.4,'triangle',.18,620); }
  function thumpSound(){ tone(150,0,.2,'sine',.22,90); }
  function chirp(){ tone(1900,0,.09,'sine',.08,2500); tone(2100,.1,.08,'sine',.07,2700); }
  function maydayChime(){ tone(988,0,.09,'square',.06); tone(988,.16,.09,'square',.06); tone(740,.38,.16,'square',.06); }
  function hornSound(){ tone(150,0,.4,'square',.12,140); tone(225,.06,.34,'triangle',.1,210); }

  // ---------- animal voices ----------
  const VOICES={
    bunny:function(){ tone(600,0,.1,'sine',.2,900); tone(800,.1,.12,'sine',.2,1200); },
    kitty:function(){ tone(650,0,.12,'sine',.2,880); tone(880,.12,.3,'sine',.2,430); },
    puppy:function(){ tone(220,0,.09,'square',.12,175); tone(235,.15,.09,'square',.12,180); },
    chick:function(){ tone(2200,0,.07,'sine',.09,2600); tone(2300,.09,.07,'sine',.09,2700); },
    piggy:function(){ tone(300,0,.12,'sawtooth',.1,190); tone(280,.16,.12,'sawtooth',.1,175); },
    lamb:function(){ tone(500,0,.09,'triangle',.15,430); tone(430,.1,.09,'triangle',.15,500); tone(500,.2,.15,'triangle',.15,390); }
  };
  const ANIMAL_TYPES=[
    {id:'bunny',e:'🐰'},{id:'kitty',e:'🐱'},{id:'puppy',e:'🐶'},
    {id:'chick',e:'🐤'},{id:'piggy',e:'🐷'},{id:'lamb',e:'🐑'}
  ];
  let lastVoiceAt=-9;
  function animalVoice(id,force){
    const now=performance.now()/1000;
    if(!force && now-lastVoiceAt<1.2) return;
    lastVoiceAt=now;
    if(VOICES[id]) VOICES[id]();
  }

  // ---------- confetti / spray ----------
  const canvas=document.getElementById('confetti');
  const ctx=canvas.getContext('2d');
  function sizeCanvas(){ canvas.width=W; canvas.height=H; }
  sizeCanvas();
  const particles=[];
  const brightColors=['#FF8FB1','#FFD166','#7FD8BE','#9BB8FF','#C39BFF','#FFA45B'];
  const sprayWhites=['#FFFFFF','#E1F5FE','#B3E5FC'];
  function spray(x,y,count,palette,speedMin,speedMax,upKick,lifeFade){
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2;
      const sp=speedMin+Math.random()*(speedMax-speedMin);
      particles.push({
        x,y,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-upKick,
        r:4+Math.random()*5,
        color:palette[Math.floor(Math.random()*palette.length)],
        life:1, fade:lifeFade
      });
    }
  }
  function burst(x,y){
    spray(x,y,16,brightColors,90,310,60,1.1);
    const star=document.createElement('div');
    star.className='rewardStar';
    star.textContent='⭐';
    star.style.left=(x-22)+'px';
    star.style.top=(y-22)+'px';
    world.appendChild(star);
    setTimeout(()=>star.remove(),1050);
  }
  function dustPuff(x,y){ spray(x,y,10,['#FFFFFF','#ECEFF1','#CFD8DC'],40,130,20,2.2); }
  function splash(x,y){ spray(x,y,12,sprayWhites,60,190,90,2); }
  function hearts(x,y,n){
    const set=['❤️','💛','💙','🧡'];
    for(let i=0;i<n;i++){
      const h=document.createElement('div');
      h.className='heart';
      h.textContent=set[Math.floor(Math.random()*set.length)];
      h.style.left=(x-15+(Math.random()*60-30))+'px';
      h.style.top=(y-15+(Math.random()*30-15))+'px';
      h.style.animationDelay=(Math.random()*.25)+'s';
      world.appendChild(h);
      setTimeout(()=>h.remove(),1800);
    }
  }
  function bubble(x,y,emoji){
    const b=document.createElement('div');
    b.className='bubble';
    b.textContent=emoji;
    b.style.left=(x-12)+'px';
    b.style.top=(y-12)+'px';
    world.appendChild(b);
    setTimeout(()=>b.remove(),1300);
  }

  // ---------- rescue helicopters (squad livery) ----------
  function heliSVG(a){
    return '<svg viewBox="0 0 190 130" xmlns="http://www.w3.org/2000/svg">'+
      '<rect x="91" y="16" width="8" height="14" rx="3" fill="#7A8AA0"/>'+
      '<path d="M28,54 L78,44 L82,66 L34,66 Z" fill="#FAFAFA"/>'+
      '<path d="M28,54 L78,49 L79,58 L30,63 Z" fill="'+a.main+'"/>'+
      '<path d="M22,38 L36,38 L34,58 L24,58 Z" fill="'+a.main+'"/>'+
      '<circle class="beaconDot" cx="29" cy="34" r="4" fill="#FF1744"/>'+
      '<g class="rotor-tail"><rect x="13" y="34" width="6" height="36" rx="3" fill="#5B6B80"/></g>'+
      '<ellipse cx="112" cy="66" rx="54" ry="38" fill="#FAFAFA"/>'+
      '<ellipse cx="112" cy="82" rx="54" ry="22" fill="#E3E8EE" opacity=".7"/>'+
      '<path d="M62,72 L162,62 L164,78 L64,88 Z" fill="'+a.main+'"/>'+
      '<path d="M126,40 A40,34 0 0 1 160,70 L126,70 Z" fill="#BDEBFF" stroke="#FFFFFF" stroke-width="4"/>'+
      '<circle cx="138" cy="58" r="7" fill="#fff"/><circle cx="140" cy="59" r="3.4" fill="#2B3A4A"/>'+
      '<circle cx="152" cy="60" r="7" fill="#fff"/><circle cx="154" cy="61" r="3.4" fill="#2B3A4A"/>'+
      '<path d="M122,94 Q132,100 142,92" stroke="'+a.dark+'" stroke-width="4" fill="none" stroke-linecap="round"/>'+
      '<circle cx="86" cy="56" r="12" fill="'+a.main+'"/>'+
      '<text x="86" y="61" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="system-ui,sans-serif">9</text>'+
      '<rect x="86" y="102" width="6" height="14" rx="3" fill="#7A8AA0"/>'+
      '<rect x="130" y="102" width="6" height="14" rx="3" fill="#7A8AA0"/>'+
      '<rect x="66" y="114" width="90" height="7" rx="3.5" fill="#5B6B80"/>'+
      '<g class="rotor-main"><rect x="15" y="10" width="160" height="8" rx="4" fill="#5B6B80"/></g>'+
      '<circle cx="95" cy="14" r="7" fill="#43536A"/></svg>';
  }
  const ORANGE={main:'#FF7043', dark:'#E64A19'};
  const BLUE  ={main:'#42A5F5', dark:'#1E88E5'};

  const players=[];
  function addHeli(accent, startX, startY, keymap, bobPhase){
    const el=document.createElement('div');
    el.className='heli';
    el.innerHTML=heliSVG(accent);
    const rope=document.createElement('div');
    rope.className='rope';
    const basket=document.createElement('div');
    basket.className='basket';
    world.appendChild(rope);
    world.appendChild(basket);
    world.appendChild(el);
    const p={
      el, rope, basket,
      px:startX, py:startY, tx:startX, ty:startY, vx:0,
      keymap, bobPhase, landed:false,
      bx:startX, blen:26,
      cargo:[], boardCd:0, dropCd:0, delivering:false, washT:0
    };
    renderBasket(p);
    players.push(p);
    return p;
  }
  function renderBasket(p){
    let html='🧺';
    if(p.cargo[0]) html+='<span class="rider" style="left:2px;top:-16px;">'+p.cargo[0].e+'</span>';
    if(p.cargo[1]) html+='<span class="rider" style="left:16px;top:-11px;">'+p.cargo[1].e+'</span>';
    p.basket.innerHTML=html;
  }

  const p1=addHeli(ORANGE, W*0.35, H*0.35,
    {up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD']}, 0);
  let p2=null;

  // ---------- animals in the water waiting for rescue ----------
  const floaters=[];
  let animalRespawn=0;
  function pickType(){
    const present=new Set(floaters.map(a=>a.type.id));
    players.forEach(p=>p.cargo.forEach(c=>present.add(c.id)));
    const fresh=ANIMAL_TYPES.filter(t=>!present.has(t.id));
    const pool=fresh.length?fresh:ANIMAL_TYPES;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function spawnFloater(x){
    const type=pickType();
    const el=document.createElement('div');
    el.className='animal float hopIn';
    el.innerHTML='<svg class="ring" width="52" height="22" viewBox="0 0 52 22">'+
      '<ellipse cx="26" cy="11" rx="21" ry="8" fill="none" stroke="#FF7043" stroke-width="7"/>'+
      '<path d="M8,7 A21,8 0 0 1 16,3" stroke="#FFFFFF" stroke-width="7" fill="none"/>'+
      '<path d="M36,3 A21,8 0 0 1 44,7" stroke="#FFFFFF" stroke-width="7" fill="none"/></svg>'+
      '<span class="fella">'+type.e+'</span>';
    world.appendChild(el);
    const maxX=Math.max(160,dockLeft-110);
    const ax=x!==undefined?x:60+Math.random()*(maxX-60);
    floaters.push({
      el, type, x:ax,
      hopPhase:Math.random()*6,
      exciteCd:0, callT:4+Math.random()*6
    });
    splash(ax,waterY);
    bubble(ax,waterY-56,'❗');
    maydayChime();
  }
  for(let i=0;i<3;i++) spawnFloater(80+Math.random()*(W*0.4));

  // ---------- rescued friends safe at the station ----------
  const residents=[];
  function reflowDock(){
    const n=residents.length;
    residents.forEach((r,i)=>{
      r.slotX=Math.min(Math.max(stationX-90+(i-(n-1)/2)*32,dockLeft+30),W-26);
    });
  }
  function addResident(type,x,y){
    const el=document.createElement('div');
    el.className='animal';
    el.style.zIndex=3;
    el.textContent=type.e;
    world.appendChild(el);
    residents.push({el,type,x,y,slotX:x,phase:Math.random()*6});
    reflowDock();
    if(residents.length>8){
      const old=residents.shift();
      hearts(old.x,dockY-46,2);
      old.el.style.transition='opacity .8s';
      old.el.style.opacity='0';
      setTimeout(()=>old.el.remove(),850);
      reflowDock();
    }
  }

  // ---------- boarding & delivery ----------
  function board(a,p){
    const i=floaters.indexOf(a);
    if(i<0||p.cargo.length>=2) return;
    floaters.splice(i,1);
    a.el.remove();
    p.cargo.push(a.type);
    renderBasket(p);
    animalVoice(a.type.id,true);
    splash(a.x,waterY);
    hearts(p.bx,p.py+p.blen+40,2);
    animalRespawn=2.5+Math.random()*3;
  }
  function deliverOne(p){
    const type=p.cargo.shift();
    if(!type) return;
    renderBasket(p);
    const dropX=p.bx;
    addResident(type,dropX,dockY-34);
    animalVoice(type.id,true);
    spray(dropX,dockY-30,10,brightColors,70,220,50,1.3);
    if(Math.random()<.6) burst(padX,dockY-80);
  }

  // ---------- player 2 toggle ----------
  let hintTimer=null;
  function showHint(){
    keyHint.style.opacity='1';
    clearTimeout(hintTimer);
    hintTimer=setTimeout(()=>{ keyHint.style.opacity='0'; },6000);
  }
  p2btn.addEventListener('pointerdown',e=>e.stopPropagation());
  p2btn.addEventListener('click',()=>{
    unlockAudio();
    if(!p2){
      p2=addHeli(BLUE, W*0.2, H*0.3,
        {up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight']}, Math.PI);
      p2btn.textContent='Remove player 2';
      burst(W*0.2, H*0.3);
      popSound();
      showHint();
    }else{
      p2.cargo.forEach((type,i)=>{
        spawnFloater(Math.min(Math.max(p2.px+i*60-30,70),Math.max(160,dockLeft-110)));
      });
      p2.el.remove(); p2.rope.remove(); p2.basket.remove();
      players.splice(players.indexOf(p2),1);
      p2=null;
      p2btn.textContent='Add player 2';
      keyHint.style.opacity='0';
    }
    p2btn.blur();
  });

  // ---------- keyboard ----------
  const pressed=new Set();
  const gameKeys=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space']);
  addEventListener('keydown',e=>{
    if(gameKeys.has(e.code)){ e.preventDefault(); unlockAudio(); pressed.add(e.code); }
  });
  addEventListener('keyup',e=>{ pressed.delete(e.code); });
  addEventListener('blur',()=>pressed.clear());
  function keyDir(map){
    const has=list=>list.some(k=>pressed.has(k));
    return {
      x:(has(map.right)?1:0)-(has(map.left)?1:0),
      y:(has(map.down)?1:0)-(has(map.up)?1:0)
    };
  }

  // ---------- clouds & weather ----------
  const cloudColors=['#FFFFFF','#F4FBFF'];
  const clouds=[];
  function makeCloud(startAnywhere){
    const c=document.createElement('div');
    c.className='cloud';
    const scale=.6+Math.random()*.9;
    c.innerHTML='<svg width="'+(170*scale)+'" height="'+(90*scale)+'" viewBox="0 0 170 90">'+
      '<ellipse cx="60" cy="60" rx="52" ry="26" fill="'+cloudColors[Math.floor(Math.random()*2)]+'"/>'+
      '<ellipse cx="105" cy="48" rx="42" ry="30" fill="#FFFFFF"/>'+
      '<ellipse cx="130" cy="64" rx="34" ry="20" fill="#F8FDFF"/></svg>';
    const y=Math.random()*H*0.35+10;
    const x=startAnywhere?Math.random()*W:-220;
    const speed=8+Math.random()*14;
    world.appendChild(c);
    clouds.push({el:c,x,y,speed});
  }
  for(let i=0;i<4;i++) makeCloud(true);

  let rain=null, rainTimer=16+Math.random()*18;
  function spawnRain(){
    const el=document.createElement('div');
    el.className='raincloud';
    el.innerHTML='<svg width="150" height="66" viewBox="0 0 170 90">'+
      '<ellipse cx="60" cy="60" rx="52" ry="26" fill="#90A4AE"/>'+
      '<ellipse cx="105" cy="48" rx="42" ry="30" fill="#B0BEC5"/>'+
      '<ellipse cx="130" cy="64" rx="34" ry="20" fill="#90A4AE"/></svg>'+
      '<div class="rain"></div>';
    world.appendChild(el);
    rain={el,x:-170,y:H*0.1+Math.random()*H*0.12,speed:26};
  }

  // ---------- seagulls ----------
  const birds=[];
  let birdTimer=4;
  function spawnFlock(){
    const dir=Math.random()<.5?1:-1;
    const baseY=H*(0.1+Math.random()*0.28);
    const startX=dir>0?-60:W+60;
    for(let i=0;i<3;i++){
      const el=document.createElement('div');
      el.className='bird';
      el.textContent='🐦';
      world.appendChild(el);
      birds.push({
        el, x:startX-dir*i*44,
        baseY:baseY+i*14, y:baseY,
        vx:dir*(60+Math.random()*35), vy:0,
        scattered:false, life:1,
        phase:Math.random()*6
      });
    }
  }

  // ---------- rescue boat on patrol ----------
  const boat={x:W*0.3, dir:1, hornCd:0};

  // ---------- balloons ----------
  const balloons=[];
  function makeBalloon(){
    const max=p2?6:4;
    if(balloons.length>=max) return;
    const el=document.createElement('div');
    el.className='balloon';
    const col=brightColors[Math.floor(Math.random()*brightColors.length)];
    el.innerHTML='<svg viewBox="0 0 74 120">'+
      '<path d="M37,86 Q33,96 37,104 Q41,96 37,86" stroke="#8899AA" stroke-width="2.5" fill="none"/>'+
      '<ellipse cx="37" cy="46" rx="30" ry="38" fill="'+col+'"/>'+
      '<ellipse cx="27" cy="32" rx="9" ry="13" fill="#FFFFFF" opacity=".45"/>'+
      '<path d="M31,82 L43,82 L37,92 Z" fill="'+col+'"/></svg>';
    world.appendChild(el);
    balloons.push({
      el, x:40+Math.random()*(W-80),
      y:H+80,
      speed:34+Math.random()*26,
      sway:14+Math.random()*16,
      phase:Math.random()*Math.PI*2
    });
  }

  // ---------- steering ----------
  function clampX(x){ return Math.min(Math.max(x,70),W-70); }
  function clampYFor(x,y){
    const maxY=x>dockLeft-30 ? dockY-50 : waterY-80;
    return Math.min(Math.max(y,70),maxY);
  }
  function setTarget(e){
    unlockAudio();
    const p=e.touches?e.touches[0]:e;
    p1.tx=clampX(p.clientX);
    p1.ty=clampYFor(p1.tx,p.clientY);
  }
  world.addEventListener('pointerdown',setTarget);
  world.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') setTarget(e); });
  world.addEventListener('touchmove',e=>{ e.preventDefault(); setTarget(e); },{passive:false});

  // ---------- main loop ----------
  const KEY_SPEED=430;
  let boopCooldown=0;
  let alertOn=false;
  let last=performance.now();
  let spawnTimer=0;
  function frame(now){
    const dt=Math.min((now-last)/1000,.05);
    last=now;
    const t=now/1000;

    // ----- helicopters -----
    for(const p of players){
      const dir=keyDir(p.keymap);
      if(dir.x||dir.y){
        const len=Math.hypot(dir.x,dir.y);
        p.tx=clampX(p.tx+dir.x/len*KEY_SPEED*dt);
        p.ty=clampYFor(p.tx,p.ty+dir.y/len*KEY_SPEED*dt);
      }
      if(Math.abs(p.tx-padX)<95 && p.ty>padRestY()-160){
        p.tx=padX; p.ty=padRestY();
      }

      const ox=p.px;
      p.px+=(p.tx-p.px)*Math.min(1,dt*4.5);
      p.py+=(p.ty-p.py)*Math.min(1,dt*4.5);
      p.vx=(p.px-ox)/Math.max(dt,.001);

      const settled=Math.abs(p.tx-p.px)<9 && Math.abs(p.ty-p.py)<9;
      const onDock=p.px>dockLeft+10 && Math.abs(p.py-(dockY-REST_OFFSET))<20;
      const landedNow=settled && onDock;
      if(landedNow && !p.landed){
        p.landed=true;
        p.el.classList.add('landed');
        dustPuff(p.px,p.py+58);
        if(p.cargo.length){ arpeggio(); p.dropCd=.4; }
        else thumpSound();
      }else if(!landedNow && p.landed){
        p.landed=false;
        p.el.classList.remove('landed');
        whooshSound();
        dustPuff(p.px,p.py+58);
      }

      const bob=p.landed?0:Math.sin(t*2.2+p.bobPhase)*6;
      const tilt=p.landed?0:Math.max(-16,Math.min(16,p.vx*0.03));
      p.el.style.transform='translate('+p.px+'px,'+(p.py+bob)+'px) rotate('+tilt+'deg)';

      // rotor wash sprays the water when flying low over the sea
      p.washT-=dt;
      if(!p.landed && p.px<dockLeft-10 && p.py>waterY-170 && p.washT<=0){
        p.washT=.07;
        spray(p.px+(Math.random()*90-45),waterY-2,1,sprayWhites,30,90,40,2.6);
      }

      // ----- winch -----
      const attachY=p.py+46;
      let targetLen=26+(p.cargo.length?12:0);
      let mode='idle';
      p.boardCd-=dt; p.dropCd-=dt;

      if(!p.landed){
        const overDock=p.px>dockLeft+20 && attachY<dockY-80;
        if(p.cargo.length && overDock){
          targetLen=dockY-26-attachY;
          mode='deliver';
        }else if(p.cargo.length<2){
          let best=null,bd=1e9;
          for(const a of floaters){
            const dx=Math.abs(p.px-a.x);
            if(dx<85 && attachY<waterY-26 && dx<bd){ bd=dx; best=a; }
          }
          if(best && Math.abs(p.vx)<260){
            targetLen=(waterY-14)-attachY;
            mode='pickup';
            p.pickupTarget=best;
          }
        }
      }
      if(mode==='deliver' && !p.delivering){ p.delivering=true; arpeggio(); p.dropCd=.5; }
      if(mode!=='deliver' && !p.landed) p.delivering=false;

      p.blen+=(targetLen-p.blen)*Math.min(1,dt*3.2);
      p.bx+=(p.px-p.bx)*Math.min(1,dt*6);
      const basketY=attachY+p.blen;

      if(mode==='pickup' && p.boardCd<=0){
        const a=p.pickupTarget;
        if(floaters.includes(a) &&
           Math.abs(basketY-(waterY-14))<16 && Math.abs(p.bx-a.x)<48){
          board(a,p); p.boardCd=.9;
        }
      }
      if(p.cargo.length && p.dropCd<=0){
        if(p.landed){ deliverOne(p); p.dropCd=.55; }
        else if(mode==='deliver' && basketY>dockY-48){ deliverOne(p); p.dropCd=.55; }
      }

      const rdx=p.bx-p.px, rdy=basketY-14-attachY;
      const rlen=Math.max(Math.hypot(rdx,rdy),1);
      p.rope.style.height=rlen+'px';
      p.rope.style.left=(p.px-1.5)+'px';
      p.rope.style.top=attachY+'px';
      p.rope.style.transform='rotate('+Math.atan2(-rdx,rdy)+'rad)';
      p.basket.style.transform='translate('+(p.bx-17)+'px,'+(basketY-14)+'px)';
    }

    // ----- animals bobbing in the sea -----
    animalRespawn-=dt;
    if(floaters.length<3 && animalRespawn<=0){
      spawnFloater();
      animalRespawn=3+Math.random()*3;
    }
    for(const a of floaters){
      a.exciteCd-=dt; a.callT-=dt;
      let near=false;
      for(const p of players){
        if(Math.hypot(p.px-a.x,p.py-(waterY-30))<180){ near=true; break; }
      }
      if(near && a.exciteCd<=0){
        a.exciteCd=4;
        bubble(a.x,waterY-58,'💕');
        animalVoice(a.type.id,false);
      }
      if(!near && a.callT<=0){
        a.callT=7+Math.random()*7;
        bubble(a.x,waterY-58,'❗');
        animalVoice(a.type.id,false);
      }
      a.x+=Math.sin(t*.25+a.hopPhase)*4*dt;
      const bobY=Math.sin(t*1.6+a.hopPhase)*4;
      const rock=Math.sin(t*1.6+a.hopPhase)*6;
      const wig=near?Math.sin(t*10)*3:0;
      a.el.style.transform='translate('+(a.x-26)+'px,'+(waterY-42+bobY)+'px) rotate('+(rock+wig)+'deg)';
    }
    const need=floaters.length>0;
    if(need!==alertOn){ alertOn=need; stationEl.classList.toggle('alert',need); }

    // ----- rescued friends on the dock -----
    for(const r of residents){
      r.x+=(r.slotX-r.x)*Math.min(1,dt*3);
      let near=false;
      for(const p of players){
        if(Math.hypot(p.px-r.x,p.py-(dockY-30))<170){ near=true; break; }
      }
      const travel=Math.min(Math.abs(r.slotX-r.x)*0.15,26);
      const hop=Math.abs(Math.sin(t*3+r.phase))*(near?14:6)+travel;
      r.el.style.transform='translate('+(r.x-19)+'px,'+(dockY-42-hop)+'px)';
    }

    // ----- patrol boat -----
    boat.hornCd-=dt;
    boat.x+=boat.dir*24*dt;
    const boatMin=70, boatMax=Math.max(200,dockLeft-100);
    if(boat.x>boatMax){ boat.dir=-1; }
    if(boat.x<boatMin){ boat.dir=1; }
    const bBob=Math.sin(t*1.5)*4;
    const bRock=Math.sin(t*1.5)*3;
    for(const p of players){
      if(boat.hornCd<=0 && Math.hypot(p.px-boat.x,p.py-(waterY-40))<170){
        boat.hornCd=6;
        hornSound();
        bubble(boat.x,waterY-88,'👋');
      }
    }
    boatEl.style.left=(boat.x-65)+'px';
    boatEl.style.top=(waterY-62+bBob)+'px';
    boatEl.style.transform='scaleX('+boat.dir+') rotate('+bRock+'deg)';

    // ----- clouds & rain -----
    for(const c of clouds){
      c.x+=c.speed*dt;
      if(c.x>W+240){ c.x=-240; c.y=Math.random()*H*0.35+10; }
      c.el.style.transform='translate('+c.x+'px,'+c.y+'px)';
    }
    if(!rain){
      rainTimer-=dt;
      if(rainTimer<=0) spawnRain();
    }else{
      rain.x+=rain.speed*dt;
      rain.el.style.transform='translate('+rain.x+'px,'+rain.y+'px)';
      if(rain.x>W+40){ rain.el.remove(); rain=null; rainTimer=22+Math.random()*22; }
    }

    // ----- seagulls -----
    birdTimer-=dt;
    if(birdTimer<=0 && birds.length<6){ spawnFlock(); birdTimer=9+Math.random()*6; }
    for(let i=birds.length-1;i>=0;i--){
      const b=birds[i];
      if(!b.scattered){
        b.x+=b.vx*dt;
        b.y=b.baseY+Math.sin(t*3+b.phase)*8;
        for(const p of players){
          if(Math.hypot(p.px-b.x,p.py-b.y)<125){
            b.scattered=true;
            b.vx=(b.x<p.px?-1:1)*230; b.vy=-190;
            chirp();
            break;
          }
        }
      }else{
        b.x+=b.vx*dt; b.y+=b.vy*dt;
        b.life-=dt*1.2;
        b.el.style.opacity=Math.max(b.life,0);
        if(b.life<=0){ b.el.remove(); birds.splice(i,1); continue; }
      }
      if(b.x<-120||b.x>W+120||b.y<-80){ b.el.remove(); birds.splice(i,1); continue; }
      b.el.style.transform='translate('+b.x+'px,'+b.y+'px) scaleX('+(b.vx>0?-1:1)+')';
    }

    // ----- copter high-five -----
    boopCooldown-=dt;
    if(p2 && boopCooldown<=0 && !p1.landed && !p2.landed){
      const dx=p2.px-p1.px, dy=p2.py-p1.py;
      const d=Math.hypot(dx,dy);
      if(d<150 && d>1){
        boopCooldown=2.5;
        hearts((p1.px+p2.px)/2,(p1.py+p2.py)/2,4);
        boopSound();
        const nx=dx/d, ny=dy/d;
        p1.tx=clampX(p1.tx-nx*70); p1.ty=clampYFor(p1.tx,p1.ty-ny*70);
        p2.tx=clampX(p2.tx+nx*70); p2.ty=clampYFor(p2.tx,p2.ty+ny*70);
      }
    }

    // ----- balloons -----
    spawnTimer-=dt;
    if(spawnTimer<=0){ makeBalloon(); spawnTimer=(p2?1.6:2.2)+Math.random()*1.6; }
    outer:
    for(let i=balloons.length-1;i>=0;i--){
      const b=balloons[i];
      b.y-=b.speed*dt;
      const bx=b.x+Math.sin(t*1.4+b.phase)*b.sway;
      b.el.style.transform='translate('+(bx-37)+'px,'+(b.y-60)+'px)';
      for(const p of players){
        const dx=bx-p.px, dy=(b.y-14)-p.py;
        if(Math.hypot(dx,dy)<86){
          burst(bx,b.y-14);
          popSound();
          b.el.remove(); balloons.splice(i,1);
          continue outer;
        }
      }
      if(b.y<-140){ b.el.remove(); balloons.splice(i,1); }
    }

    // ----- particles -----
    ctx.clearRect(0,0,W,H);
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.vy+=420*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.life-=dt*p.fade;
      if(p.life<=0){ particles.splice(i,1); continue; }
      ctx.globalAlpha=Math.max(p.life,0);
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener('resize',()=>{
    W=innerWidth; H=innerHeight; sizeCanvas(); placeScene(); buildWaves();
    for(const p of players){ p.tx=clampX(p.tx); p.ty=clampYFor(p.tx,p.ty); }
    const maxX=Math.max(160,dockLeft-110);
    for(const a of floaters){ a.x=Math.min(a.x,maxX); }
    boat.x=Math.min(boat.x,Math.max(200,dockLeft-100));
    reflowDock();
  });
})();
</script>
</body>
</html>
