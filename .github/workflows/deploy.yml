name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure GitOps deploy key
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/copter-game-gitops
          chmod 0600 ~/.ssh/copter-game-gitops
          ssh-keyscan -H github.com > ~/.ssh/known_hosts

      - name: Deploy production build
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/copter-game-gitops -o IdentitiesOnly=yes
        run: |
          git clone git@github.com:mbcoward3/talos-cluster.git gitops
          cp rescue-squad-3d.html gitops/apps/copter-game/prod/site/index.html
          cd gitops
          if git diff --quiet; then
            echo 'Production already has this build'
            exit 0
          fi
          git config user.name 'copter-game-deploy-bot'
          git config user.email 'copter-game-deploy-bot@users.noreply.github.com'
          git add apps/copter-game/prod/site/index.html
          git commit -m "chore: deploy Copter Game ${GITHUB_SHA::12}"
          git pull --rebase origin main
          git push origin main
