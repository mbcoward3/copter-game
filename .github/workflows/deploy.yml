name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize promotion so an older build cannot overwrite latest after a newer one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - run: npm ci
      - run: npm test
      - run: npm run test:docs
      - run: npm run build:hosted
      - run: python3 tools/deploy/test-chart.py

  # Plays every vehicle through every mission from fixed seeds in headless Chrome (nothing drawn) and fails on a
  # broken rule, an unfinished mission or a score worse than tools/checks/check-baseline.json.
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run build
      - run: npm run check
        env:
          CHROME: /usr/bin/google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: build/check/
          if-no-files-found: ignore

  publish:
    needs: [validate, simulate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.1
      - uses: imjasonh/setup-crane@v0.4
        with:
          version: v0.22.1

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mbcoward3/copter-game:latest
            ghcr.io/mbcoward3/copter-game:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Sign image, package and sign chart, then promote latest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/mbcoward3/copter-game
          chart=ghcr.io/mbcoward3/charts/copter-game
          version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          issuer=https://token.actions.githubusercontent.com

          cosign sign --yes "$image@$IMAGE_DIGEST"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$image@$IMAGE_DIGEST" >/dev/null

          # Package a copy so the published chart embeds this exact image build.
          mkdir -p build/chart build/packages
          cp -R charts/copter-game build/chart/copter-game
          python3 - "$IMAGE_DIGEST" <<'PY'
          import pathlib, re, sys
          digest = sys.argv[1]
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('invalid build digest')
          path = pathlib.Path('build/chart/copter-game/values.yaml')
          text, count = re.subn(r'(?m)^  digest: ""$', f'  digest: "{digest}"', path.read_text())
          if count != 1:
              raise SystemExit('expected one digest placeholder')
          path.write_text(text)
          PY
          helm lint build/chart/copter-game --strict
          helm package build/chart/copter-game --destination build/packages \
            --version "$version" --app-version "$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push "build/packages/copter-game-$version.tgz" oci://ghcr.io/mbcoward3/charts
          digest=$(crane digest "$chart:$version")
          cosign sign --yes "$chart@$digest"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$chart@$digest" >/dev/null
          # Flux only sees this chart after packaging and signing have succeeded.
          crane tag "$chart@$digest" latest
          # shellcheck disable=SC2016 # Markdown backticks are literal output.
          printf '### Published\n- Image: `%s@%s`\n- Chart: `%s:%s`\n- Chart digest: `%s`\n- Promoted chart tag: `latest`\n' \
            "$image" "$IMAGE_DIGEST" "$chart" "$version" "$digest" >> "$GITHUB_STEP_SUMMARY"
